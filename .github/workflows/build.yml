name: Build RavenEmu
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository typography
        run: python tools/check_text_style.py
      - name: Check RetroAchievements navigation
        run: python tools/check_ra_navigation.py
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev libsecret-1-dev gnome-keyring dbus-x11 patchelf
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install sdl2
      - name: Windows prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { "C:\\vcpkg" }
          if (-not (Test-Path "$root/vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$root"
            & "$root/bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$root/vcpkg.exe" install sdl2:x64-windows curl:x64-windows
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Use Apple's HTTPS library and certificate trust. SDL2 is bundled
            # from Homebrew; the downloaded app never requires Homebrew.
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
              "-DCURL_LIBRARY=$(xcrun --show-sdk-path)/usr/lib/libcurl.tbd" \
              "-DCURL_INCLUDE_DIR=$(xcrun --show-sdk-path)/usr/include"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Linux native credential vault test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          trap 'rm -rf "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"' EXIT
          dbus-run-session -- bash -e -c '
            printf "%s" "SyntheticTestKeyringPassword" | gnome-keyring-daemon --unlock --components=secrets
            ./build/ravenemudsk_native_session_test
          '
      - name: macOS native credential vault test
        if: runner.os == 'macOS'
        shell: bash
        run: |
          vault="$RUNNER_TEMP/ravenemu-test.keychain-db"
          previous_default=$(security default-keychain -d user | tr -d '"' | xargs)
          security create-keychain -p SyntheticTestKeyringPassword "$vault"
          security unlock-keychain -p SyntheticTestKeyringPassword "$vault"
          security default-keychain -d user -s "$vault"
          security list-keychains -d user -s "$vault" "$previous_default"
          trap 'security default-keychain -d user -s "$previous_default"; security list-keychains -d user -s "$previous_default"; security delete-keychain "$vault"' EXIT
          ./build/ravenemudsk_native_session_test
      - name: Package
        timeout-minutes: 8
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Fails when a DLL that RavenEmu loads is neither in the archive nor part of Windows.
            python tools/package_windows.py --build build/Release --output dist
          else
            python tools/package_unix.py --build build --output dist
          fi
      - name: Test Linux archive without installed dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          runtime_dir="$RUNNER_TEMP/RavenEmu portable"
          mkdir -p "$runtime_dir"
          tar -xzf dist/RavenEmu-Linux-*.tar.gz -C "$runtime_dir"
          runtime=(docker run --rm --network none --read-only
            --tmpfs /tmp:rw,mode=1777 --user 1000:1000
            --mount "type=bind,source=$runtime_dir/RavenEmu,target=/opt/RavenEmu,readonly"
            --env HOME=/tmp --env XDG_DATA_HOME=/tmp/data
            --env SDL_VIDEODRIVER=dummy --env SDL_AUDIODRIVER=dummy
            --env RAVENEMUDSK_UI_SMOKE=1 ubuntu:24.04)
          "${runtime[@]}" /opt/RavenEmu/RavenEmu --help
          "${runtime[@]}" /opt/RavenEmu/RavenEmu
      - uses: actions/upload-artifact@v4
        with:
          name: RavenEmu-${{ runner.os }}
          path: dist/
