name: Build RavenEmuDSK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository typography
        run: python tools/check_text_style.py
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install sdl2 curl
      - name: Windows prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { "C:\\vcpkg" }
          if (-not (Test-Path "$root/vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$root"
            & "$root/bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$root/vcpkg.exe" install sdl2:x64-windows curl:x64-windows
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/Release/RavenEmuDSK.exe dist/
            cp build/Release/*.dll dist/ || true
            cp -r build/Release/assets dist/ || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp build/RavenEmuDSK dist/
            cp -r build/assets dist/ || true
          else
            cp build/RavenEmuDSK dist/
            cp -r build/assets dist/ || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: RavenEmuDSK-${{ runner.os }}
          path: dist/
